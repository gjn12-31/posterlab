# Extend the http-level mime table inherited by both static roots (Ubuntu 22.04 omits these).
types {
    application/javascript mjs;
    application/wasm wasm;
}
# Keep invitations, query strings, credentials and request bodies out of access logs.
log_format posterlab '$time_iso8601 $request_method $uri $status $body_bytes_sent $request_time';
map $uri $posterlab_cache_policy {
    default "no-cache";
    /enter/ "private, no-store";
    /healthz "no-store";
    ~^/(app|api|legacy|t)(/|$) "private, no-store";
    "~^/assets/.+-[a-zA-Z0-9_-]{8,}\.(?:m?js|css|woff2?|svg|png|jpe?g|webp|wasm)$" "public, max-age=31536000, immutable";
}
map $http_origin $posterlab_origin_ok {
    default 0;
    "" 1;
    "https://PUBLIC_HOST" 1;
}
# Progress polling runs every 1.8 s. Keep write limits independent of read traffic.
map $request_method $posterlab_write_client {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $binary_remote_addr zone=posterlab_api:4m rate=120r/m;
limit_req_zone $posterlab_write_client zone=posterlab_writes:2m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=posterlab_connections:2m;

server {
    listen 443 ssl;
    server_name PUBLIC_HOST;
    ssl_certificate     /etc/letsencrypt/live/PUBLIC_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PUBLIC_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/posterlab-access.log posterlab;
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    add_header Cache-Control $posterlab_cache_policy always;
    client_max_body_size 2m;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;

    if ($host != "PUBLIC_HOST") { return 421; }
    location = /enter/ {
        auth_basic off;
        root /opt/posterlab/current/deploy;
        try_files /invitation.html =404;
        default_type text/html;
    }
    location = /healthz {
        auth_basic off;
        limit_except GET { deny all; }
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:8787/healthz;
    }

    # Each path invitation overrides these credentials with its own server-side realm.
    auth_basic "PosterLab studio";
    auth_basic_user_file /etc/nginx/posterlab-users;
    include /etc/nginx/posterlab-workspace-paths/*.conf;
    location ^~ /t/ { return 404; }
    location = /app { return 308 /app/; }
    location /app/ {
        alias /opt/posterlab/current/site/;
        index index.html;
    }
    location /api/ {
        if ($posterlab_origin_ok = 0) { return 403; }
        limit_req zone=posterlab_api burst=40 nodelay;
        limit_req zone=posterlab_writes burst=10 nodelay;
        limit_conn posterlab_connections 12;
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header Cache-Control;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:8787;
    }
    location /legacy/ {
        proxy_set_header Host 127.0.0.1:8787;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_pass http://127.0.0.1:8787;
    }
    location = /api { return 404; }
    location = /legacy { return 308 /legacy/; }
    location / {
        auth_basic off;
        limit_except GET { deny all; }
        root /opt/posterlab/public;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
