# One independent browser origin and fixed upstream for each invited workspace.
map $http_origin $posterlab_origin_WS_BACKEND {
    default 0;
    "" 1;
    "WS_ORIGIN" 1;
}

server {
    listen WS_PORT ssl;
    server_name PUBLIC_HOST;
    ssl_certificate /etc/letsencrypt/live/PUBLIC_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PUBLIC_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/posterlab-access.log posterlab;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    client_max_body_size 2m;
    limit_req_status 429;
    limit_conn_status 429;

    if ($host != "PUBLIC_HOST") { return 421; }
    WS_SNI_GUARD
    auth_basic "PosterLab WS_NAME";
    auth_basic_user_file /etc/nginx/posterlab-workspace-WS_NAME.users;
    location = / { return 302 https://HOME_HOST/; }
    location = /enter/ {
        auth_basic off;
        root /opt/posterlab/current/deploy;
        try_files /invitation.html =404;
        default_type text/html;
    }
    location = /app { return 308 /app/; }
    location /app/ {
        alias /opt/posterlab/current/site/;
        index index.html;
    }
    location ~ ^/(api|legacy)/ {
        if ($posterlab_origin_WS_BACKEND = 0) { return 403; }
        limit_req zone=posterlab_api burst=40 nodelay;
        limit_req zone=posterlab_writes burst=10 nodelay;
        limit_conn posterlab_connections 12;
        proxy_set_header Host 127.0.0.1:WS_BACKEND;
        proxy_set_header Origin "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-For "";
        proxy_hide_header Cache-Control;
        proxy_read_timeout 600s;
        proxy_pass http://127.0.0.1:WS_BACKEND;
    }
    location / { return 404; }
}
