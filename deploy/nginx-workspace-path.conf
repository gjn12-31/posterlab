# Included inside the primary HTTPS server, before the reserved /t/ fallback.
location = /t/WS_NAME { return 308 /t/WS_NAME/; }
location = /t/WS_NAME/ { return 302 /t/WS_NAME/app/; }
location = /t/WS_NAME/app { return 308 /t/WS_NAME/app/; }
location = /t/WS_NAME/enter/ {
    auth_basic off;
    root /usr/local/lib/posterlab-workspaces;
    try_files /invitation.html =404;
    default_type text/html;
}
location ^~ /t/WS_NAME/app/ {
    auth_basic "PosterLab WS_NAME";
    auth_basic_user_file /etc/nginx/posterlab-workspace-WS_NAME.users;
    alias /opt/posterlab/current/site/;
    index index.html;
}
location ^~ /t/WS_NAME/api/ {
    auth_basic "PosterLab WS_NAME";
    auth_basic_user_file /etc/nginx/posterlab-workspace-WS_NAME.users;
    if ($posterlab_origin_ok = 0) { return 403; }
    limit_req zone=posterlab_api burst=40 nodelay;
    limit_req zone=posterlab_writes burst=10 nodelay;
    limit_conn posterlab_connections 12;
    proxy_set_header Host 127.0.0.1:WS_BACKEND;
    proxy_set_header Origin "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-For "";
    proxy_hide_header Cache-Control;
    proxy_read_timeout 600s;
    proxy_pass http://127.0.0.1:WS_BACKEND/api/;
}
location ^~ /t/WS_NAME/legacy/ {
    auth_basic "PosterLab WS_NAME";
    auth_basic_user_file /etc/nginx/posterlab-workspace-WS_NAME.users;
    if ($posterlab_origin_ok = 0) { return 403; }
    proxy_set_header Host 127.0.0.1:WS_BACKEND;
    proxy_set_header Origin "";
    proxy_set_header Authorization "";
    proxy_set_header X-Forwarded-Host "";
    proxy_pass http://127.0.0.1:WS_BACKEND/legacy/;
}
