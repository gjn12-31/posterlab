<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>进入 AI 工作台 · PosterLab</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #fafbfe; color: #171a21; font-family: Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
    main { max-width: 680px; min-height: 82vh; display: flex; flex-direction: column; justify-content: center; padding: clamp(28px,7vw,66px); margin: auto; }
    .brand { font-size: 22px; font-weight: 750; letter-spacing: -.06em; margin-bottom: 44px; }
    h1 { margin: 0; font-size: clamp(34px,6vw,58px); line-height: 1.16; letter-spacing: -.06em; }
    p { margin: 1.25rem 0 0; line-height: 1.8; color: #4b566d; }
    nav { display: flex; gap: 24px; flex-wrap: wrap; align-items: center; margin-top: 32px; }
    a { color: #184ddb; text-underline-offset: 3px; font-weight: 600; }
    .primary { display: inline-block; background: #1748da; color: #fff; text-decoration: none; padding: 12px 23px; border-radius: 9px; }
    a:focus-visible { outline: 3px solid #385dbf; outline-offset: 5px; }
    aside { margin-top: 38px; border-top: 1px solid #dce0ea; padding-top: 18px; font-size: 14px; color: #576277; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <div class="brand" lang="en">PosterLab</div>
    <h1>进入 AI 工作台</h1>
    <p>用邀请凭据登录后，可以上传论文、制作活动海报并调用实时模型。首次进入时，浏览器会提示填写用户名和口令。</p>
    <nav aria-label="访问工作台">
      <a id="studio" class="primary" href="../app/#workbench">使用邀请凭据登录</a>
      <a href="/#collection">浏览公开案例</a>
    </nav>
    <aside>需要访问权限？请向提供此链接的项目负责人索取邀请凭据。</aside>
  </main>
  <script>
    const destination = location.hash;
    if (/^#(?:papers(?:\/(?:import|story|channels(?:\/(?:x|red|moments|wechat))?))?|campaign(?:\/plan)?|workbench|studio)$/.test(destination)) {
      document.getElementById("studio").href = "../app/" + destination;
    }
  </script>
</body>
</html>
