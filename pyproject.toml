[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "posterlab"
version = "0.1.0"
description = "Traceable two-pass poster generation and evaluation lab"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2", "playwright>=1.45,<2", "streamlit>=1.65,<2", "beautifulsoup4>=4.12,<5", "tinycss2>=1.3,<2", "Pillow>=10,<13", "filelock>=3.15,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
posterlab = "posterlab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
posterlab = ["*.js"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real paid model API"]
addopts = "-m 'not live'"
